<p class="text-on-surface-variant font-body">Create an account to start pampering your pet.</p>

<!-- Registration Form -->
<form class="space-y-6">
<!-- Full Name -->
<div class="group">
<label class="block font-label text-sm font-semibold text-on-surface-variant ml-4 mb-2 tracking-wide">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-full focus:ring-2 focus:ring-primary-container transition-all outline-none font-body text-on-background placeholder:opacity-40" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="group">
<label class="block font-label text-sm font-semibold text-on-surface-variant ml-4 mb-2 tracking-wide">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-full focus:ring-2 focus:ring-primary-container transition-all outline-none font-body text-on-background placeholder:opacity-40" placeholder="hello@paws.com" type="email"/>
</div>
</div>
<!-- Phone Number -->
<div class="group">
<label class="block font-label text-sm font-semibold text-on-surface-variant ml-4 mb-2 tracking-wide">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60">call</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-full focus:ring-2 focus:ring-primary-container transition-all outline-none font-body text-on-background placeholder:opacity-40" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="group">
<label class="block font-label text-sm font-semibold text-on-surface-variant ml-4 mb-2 tracking-wide">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-highest border-none rounded-full focus:ring-2 focus:ring-primary-container transition-all outline-none font-body text-on-background placeholder:opacity-40" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60 cursor-pointer hover:opacity-100">visibility</span>
</div>
</div>
<!-- Terms & Privacy -->
<p class="text-[10px] text-center font-label text-on-surface-variant opacity-70 px-4">
                    By joining, you agree to our <span class="text-primary font-bold">Terms of Service</span> and <span class="text-primary font-bold">Privacy Policy</span>.
                </p>

<button class="w-full py-4 px-8 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg shadow-[0_8px_24px_-4px_rgba(235,39,141,0.3)] active:scale-95 transition-all hover:opacity-90" type="submit">
