<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:bg-surface-container-low transition-colors active:scale-95 duration-200 border-none">

<main class="min-h-screen pt-16 pb-32 flex flex-col items-center relative overflow-hidden bg-surface">

<div class="relative z-20 w-full max-w-md px-6 pt-24 md:pt-32 flex flex-col gap-12">

<div class="space-y-4">
<h2 class="text-4xl md:text-5xl font-headline font-extrabold text-on-background tracking-tight leading-tight">

</div>

<div class="space-y-8">
<div class="group">
<label class="block text-sm font-semibold text-primary mb-3 ml-2" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-5 text-outline pointer-events-none" data-icon="mail">mail</span>
<input class="w-full h-16 pl-14 pr-6 bg-surface-container-lowest border-none rounded-full text-on-surface placeholder:text-outline/60 shadow-ambient focus:ring-4 focus:ring-primary/10 transition-all duration-300 outline-none" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Security Message -->
<div class="p-6 bg-surface-container-low rounded-xl flex gap-4 items-start shadow-ambient">
<span class="material-symbols-outlined text-tertiary" data-icon="info">info</span>
<p class="text-sm font-body text-on-surface-variant leading-relaxed">
                        We'll send a secure link to your email. For your protection, this link will expire in 15 minutes.
                    </p>
</div>
</div>

<div class="flex justify-center opacity-10 py-8">
<span class="material-symbols-outlined text-6xl" data-icon="paws">pets</span>
</div>
</div>
