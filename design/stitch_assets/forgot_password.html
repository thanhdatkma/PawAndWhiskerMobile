        Password</h1>

  </header>
  <main class="min-h-screen pt-16 pb-32 flex flex-col items-center relative overflow-hidden">
    <!-- Hero Visual Background -->

          <span class="material-symbols-outlined text-white text-3xl" data-icon="lock_reset">lock_reset</span>
        </div>
        <h2 class="text-4xl md:text-5xl font-headline font-extrabold text-on-background tracking-tight leading-tight">
          Forgot Password
        </h2>
        <p class="text-on-surface-variant text-lg font-body max-w-[280px]">
          Enter your email address to reset your password
        </p>
      </div>
      <!-- Form Section -->
      <div class="space-y-6">
        <div class="group">
          <label class="block text-sm font-semibold text-primary mb-3 ml-2" for="email">Email Address/Phone</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-5 text-outline pointer-events-none"
              data-icon="mail">mail</span>
            <input
              class="w-full h-16 pl-14 pr-6 bg-surface-container-lowest border-none rounded-full text-on-surface placeholder:text-outline/60 shadow-[0_4px_24px_rgba(74,33,53,0.04)] focus:ring-4 focus:ring-primary/10 transition-all duration-300"

        </div>
        <!-- Security Message -->
        <div class="p-6 bg-surface-container-low rounded-lg flex gap-4 items-start">
