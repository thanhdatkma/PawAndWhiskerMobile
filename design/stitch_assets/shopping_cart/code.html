<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Be+Vietnam+Pro:wght@400;500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-primary-fixed": "#3e0020",
                        "surface-bright": "#f9f9f9",

                        "primary": "#b40068",
                        "on-tertiary-container": "#fcfcff",
                        "tertiary": "#00628a",
                        "primary-fixed": "#ffd9e4",
                        "on-tertiary": "#ffffff",

                        "tertiary-fixed-dim": "#83cfff",

                        "full": "9999px"

                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Be Vietnam Pro"]
                    }

            }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-header {
            background: rgba(249, 249, 249, 0.8);
            backdrop-filter: blur(20px);
        }
        .soft-shadow {
            box-shadow: 0 4px 32px 0 rgba(26, 28, 28, 0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface">
<!-- Header Section (Focused View Exception) -->
<header class="sticky top-0 z-50 glass-header px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center size-10 rounded-full bg-surface-container-low text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-2xl font-bold tracking-tight">Shopping Cart</h1>
</div>
<div class="text-primary font-label font-medium bg-primary-fixed px-3 py-1 rounded-full text-xs">
            2 Items
        </div>
</header>
<main class="max-w-2xl mx-auto px-6 pt-4 pb-40 space-y-8">
<!-- Cart Items List -->
<section class="space-y-4">
<!-- Item 1 -->
<div class="bg-surface-container-lowest rounded-full p-4 flex items-center gap-4 soft-shadow">
<div class="size-24 rounded-full overflow-hidden flex-shrink-0 bg-surface-container">
<img alt="Organic Kibble" class="w-full h-full object-cover" data-alt="Premium organic dog kibble in a minimalist bag sitting on a bright white studio background with soft lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6jj-LJf4rZ6049d5oZoX4OirNNMe-TVMWwY6jemYHhdOX-IasTkQguopqcSRQHoVdIJelCG9OnxvMjrdwo-W1SYrtGP-jhKjvCJhP9X-3kdo1RhYyYxV6YPiLUiDBOQHFEa37UBbvjoADDwKx3lpv7jPoCZ7aHA8HwoGxeL4puC-ZUEbUDg8BH4DMqtYanxNHl79iTbOVFI9P3EUt_P0UIF2n_s6kV8MDxkv4W7GCT95b5k4SJX6QoUOOrLABHkZsZ9YjRWjvgMg"/>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start">
<h3 class="font-headline font-bold text-base truncate">Organic Royal Canin Kibble</h3>
<span class="material-symbols-outlined text-outline text-sm" data-icon="close">close</span>
</div>
<p class="font-label text-xs text-on-surface-variant mb-2">2kg bag</p>
<div class="flex items-center justify-between">
<span class="font-headline font-extrabold text-primary text-lg">$29.75</span>
<!-- Quantity Selector -->
<div class="flex items-center gap-3 bg-surface-container-low px-3 py-1.5 rounded-full">
<button class="flex items-center justify-center size-6 rounded-full bg-surface-container-lowest text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="remove">remove</span>
</button>
<span class="font-headline font-bold text-sm w-4 text-center">1</span>
<button class="flex items-center justify-center size-6 rounded-full bg-primary text-on-primary">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</button>
</div>
</div>
</div>
</div>
<!-- Item 2 -->
<div class="bg-surface-container-lowest rounded-full p-4 flex items-center gap-4 soft-shadow">
<div class="size-24 rounded-full overflow-hidden flex-shrink-0 bg-surface-container">
<img alt="Donut Toy" class="w-full h-full object-cover" data-alt="A plush donut-shaped pet squeaky toy with pink frosting and colorful sprinkles, isolated on a soft pastel background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBmWtK0MK0w125zceCxsYhBNaCzEYC3OcpzeX0vWxv2SHLwFhsO1BZIyT060lbRBm0V6wt7uBeJcqR0deNi_L8VvPdnwrla1BP8un3IRDlDcmHV2NcoELoid7icIQ1bDVkp06QUjctutBYCpuRarBuUnT0M3zHZIPP1yVvmR7VwawhpjNN0V16YV1dRDdeFyYqGHZ1VjDLzvbHlz-bD7eSshcoYXQbiEnTyRWn-AZEU-7qzSHk0H5JgM4FOsbvnCejLQTS_4Wl3vk"/>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start">
<h3 class="font-headline font-bold text-base truncate">Plush Donut Squeaky Toy</h3>
<span class="material-symbols-outlined text-outline text-sm" data-icon="close">close</span>
</div>
<p class="font-label text-xs text-on-surface-variant mb-2">One Size</p>
<div class="flex items-center justify-between">
<span class="font-headline font-extrabold text-primary text-lg">$12.50</span>
<!-- Quantity Selector -->
<div class="flex items-center gap-3 bg-surface-container-low px-3 py-1.5 rounded-full">
<button class="flex items-center justify-center size-6 rounded-full bg-surface-container-lowest text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="remove">remove</span>
</button>
<span class="font-headline font-bold text-sm w-4 text-center">1</span>
<button class="flex items-center justify-center size-6 rounded-full bg-primary text-on-primary">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</button>
</div>
</div>
</div>
</div>
</section>
<!-- Promo Code Section -->
<section class="space-y-3">
<h4 class="font-headline font-bold text-sm px-2">Apply Promo Code</h4>
<div class="flex gap-2 p-2 bg-surface-container-low rounded-full">
<div class="flex flex-1 items-center gap-3 px-4">
<span class="material-symbols-outlined text-outline" data-icon="sell">sell</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-sm font-medium placeholder:text-outline" placeholder="Enter code" type="text"/>
</div>
<button class="bg-secondary-container text-on-secondary-container px-6 py-2 rounded-full font-headline font-bold text-sm">
                    Apply
                </button>
</div>
</section>
<!-- Order Summary -->
<section class="bg-surface-container-low rounded-[2.5rem] p-8 space-y-4">
<h4 class="font-headline font-bold text-lg mb-2">Order Summary</h4>
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-label">Subtotal</span>
<span class="font-headline font-semibold">$42.25</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-label">Shipping</span>
<span class="font-headline font-semibold">$5.00</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-label">Tax</span>
<span class="font-headline font-semibold">$0.00</span>
</div>
<div class="pt-4 border-t border-outline-variant/30 flex justify-between items-center">
<span class="font-headline font-extrabold text-xl">Total</span>
<span class="font-headline font-extrabold text-2xl text-primary">$47.25</span>
</div>
</section>
<!-- Empty Space for Bottom Bar -->
<div class="h-20"></div>
</main>
<!-- Persistent Bottom Section (Checkout CTA) -->
<div class="fixed bottom-0 left-0 right-0 p-6 glass-header border-t border-outline-variant/10">
<div class="max-w-2xl mx-auto">
<button class="group w-full bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-full p-1.5 flex items-center justify-between transition-transform active:scale-[0.98]">
<div class="flex items-center gap-4 pl-6">
<span class="font-headline font-extrabold text-lg uppercase tracking-wider">Checkout</span>
<div class="h-6 w-[1px] bg-on-primary/20"></div>
<span class="font-label font-medium">$47.25</span>
</div>
<div class="bg-on-primary/20 size-12 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</div>
</div>
</body></html>
