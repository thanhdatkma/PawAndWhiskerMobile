<!-- Product Card — Standard & Compact variants -->
<div class="product-card" [class.product-card--compact]="variant === 'compact'" (click)="onCardClick()">

  <!-- Image Area -->
  <div class="product-card__image-wrap">

    <!-- Discount Badge -->
    <ion-text *ngIf="product.discountPct" class="product-card__discount-badge">
      -{{ product.discountPct }}%
    </ion-text>

    <!-- Favorite Icon -->
    <ion-button class="product-card__fav-btn" (click)="onToggleFavorite($event)" fill="clear">
      <ng-container *ngIf="{ isFav: (favoriteService.favorites$ | async)?.includes(product.id) } as favState">
        <ion-icon slot="icon-only" [name]="favState.isFav ? 'heart' : 'heart-outline'" [class.active]="favState.isFav" class="product-card__fav-icon"></ion-icon>
      </ng-container>
    </ion-button>


    <!-- Product Image -->
    <!-- <div class="product-card__image" [style.background-image]="'url(' + product.coverImage + ')'">
    </div> -->
    <ion-img [src]="product.coverImage || 'assets/images/no-image.png'" alt="Product image"></ion-img>
  </div>

  <!-- Text Content -->
  <div class="product-card__body">
    <ion-text class="product-card__category" *ngIf="product.categoryName">{{ product.categoryName }}</ion-text>
    <h4 class="product-card__name">{{ product.name }}</h4>

    <!-- Star Rating -->
    <div *ngIf="product.rating" class="product-card__rating">
      <ion-icon name="star" class="product-card__star-icon"></ion-icon>
      <ion-text class="product-card__rating-value">{{ product.rating }}</ion-text>
      <ng-container *ngIf="product.soldCount">
        <ion-text class="product-card__sold-count">{{ product.soldCount | soldCount }} sold</ion-text>
      </ng-container>
    </div>

    <!-- Price Row -->
    <div class="product-card__price-row">
      <div class="product-card__prices">
        <ion-text *ngIf="product.discountPrice" class="product-card__original-price">
          {{ product.price | appCurrency }}
        </ion-text>
        <ion-text class="product-card__current-price">
          {{ (product.discountPrice ?? product.price) | appCurrency }}
        </ion-text>
      </div>

      <!-- Add to Cart -->
      <ion-button class="product-card__add-btn" (click)="onAddToCart($event)" fill="clear">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </div>
  </div>
</div>
