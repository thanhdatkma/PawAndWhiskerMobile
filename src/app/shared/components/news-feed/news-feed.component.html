<!-- News Feed — vertical flat list -->
<section class="news-feed">

  <!-- Section Header -->
  <div class="news-feed__header">
    <h3 class="news-feed__title">{{ sectionTitle }}</h3>
  </div>

  <!-- Article List -->
  <div class="news-feed__list">
    <div
      *ngFor="let article of visibleArticles"
      class="news-feed__item"
      (click)="onArticleClick(article)">

      <!-- Thumbnail -->
      <ion-img
        class="news-feed__thumbnail"
        [src]="getImageUrl(article)"
        [alt]="article.title"></ion-img>

      <!-- Text -->
      <div class="news-feed__body">
        <h5 class="news-feed__article-title">{{ article.title }}</h5>
        <p class="news-feed__article-summary">{{ article.summary }}</p>
        <span class="news-feed__meta">{{ article.author }} · {{ article.created_at | date:'mediumDate' }}</span>
      </div>
    </div>
  </div>

  <!-- See More -->
  <div class="news-feed__footer" *ngIf="hasMore || loadingMore">
    <button class="news-feed__see-more" (click)="onSeeMore()" [disabled]="loadingMore">
      <ion-spinner *ngIf="loadingMore" name="crescent" class="news-feed__spinner"></ion-spinner>
      <span *ngIf="!loadingMore">See More</span>
    </button>
  </div>

</section>
