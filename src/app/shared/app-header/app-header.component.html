<ion-header>
  <!-- App Header — Glassmorphism sticky top bar -->
  <header class="app-header" [class.app-header--shrunk]="isHeaderShrunk">

    <!-- Title Row -->
    <div class="app-header__title-row" [class.app-header__title-row--shrunk]="isHeaderShrunk">

      <!-- Left: Menu icon or Back button -->
      <ion-buttons slot="start">
        <ion-back-button *ngIf="showBackButton" [defaultHref]="backButtonDefaultHref" text="" icon="arrow-back-outline"></ion-back-button>
        <ion-menu-button *ngIf="!showBackButton" color="primary"></ion-menu-button>
      </ion-buttons>

      <!-- Centre: Avatar+name OR App title -->
      <div *ngIf="avatarUrl; else appTitle" class="app-header__identity"
        [class.app-header__identity--shrunk]="isHeaderShrunk">
        <div class="app-header__avatar" [class.app-header__avatar--shrunk]="isHeaderShrunk"
          [style.background-image]="'url(' + avatarUrl + ')'">
        </div>
        <div>
          <p class="app-header__subtitle" [class.app-header__subtitle--shrunk]="isHeaderShrunk">{{ subtitle ?? 'Welcome
            back,' }}</p>
          <h2 class="app-header__name" [class.app-header__name--shrunk]="isHeaderShrunk">{{ title }}</h2>
        </div>
      </div>

      <ng-template #appTitle>
        <div class="logo-wrapper" [class.logo-wrapper--shrunk]="isHeaderShrunk">
          <ion-text class="logo-text">{{ title }}</ion-text>
        </div>
      </ng-template>

      <!-- Right: Actions -->
      <ion-buttons slot="end">
        <ion-button *ngIf="showShare" color="primary" class="app-header__icon-btn" aria-label="Share" (click)="onShareClick()">
          <ion-icon slot="icon-only" name="share-outline"></ion-icon>
        </ion-button>
        <ion-button *ngIf="showFavorite" color="primary" class="app-header__icon-btn" aria-label="Favorite" (click)="onFavoriteClick()">
          <ion-icon slot="icon-only" [name]="isFavorite ? 'heart' : 'heart-outline'"></ion-icon>
        </ion-button>
        <ion-button *ngIf="showCart" color="primary" class="app-header__icon-btn app-header__cart-btn" aria-label="Open cart" (click)="onCartClick()">
          <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </div>

    <!-- Optional Search Bar -->
    <app-search-bar *ngIf="showSearch" class="app-header__search" [searchPlaceholder]="searchPlaceholder"
      (searchChange)="onSearchInput($event)">
    </app-search-bar>

  </header>
</ion-header>
