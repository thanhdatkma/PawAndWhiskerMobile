<app-header [searchBarConfig]="searchBarConfig"></app-header>

<ion-content [scrollY]="false">
  <ion-tabs (ionTabsDidChange)="onTabChange($event)">
    <ion-fab *ngIf="showScanFab" vertical="bottom" horizontal="center" slot="fixed" class="bottom-tab-nav__fab-wrap">
      <ion-fab-button class="bottom-tab-nav__fab" (click)="onScanTap()">
        <ion-icon name="scan"></ion-icon>
      </ion-fab-button>
    </ion-fab>

    <ion-tab-bar slot="bottom" class="">
      <ion-tab-button tab="home" href="/home" (click)="onTabClick('home')">
        <ion-icon aria-hidden="true" name="home"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="categories" href="/categories" (click)="onTabClick('categories')">
        <ion-icon aria-hidden="true" name="grid"></ion-icon>
        <ion-label>Categories</ion-label>
      </ion-tab-button>
      <ion-tab-button *ngIf="showScanFab" tab="" class="spacer" disabled="true" style="pointer-events: none; opacity: 1;"></ion-tab-button>

      <ion-tab-button tab="alerts" href="/alerts" (click)="onTabClick('alerts')">
        <ion-icon aria-hidden="true" name="notifications"></ion-icon>
        <ion-badge color="primary" *ngIf="(unreadCount$ | async)! > 0">{{ unreadCount$ | async }}</ion-badge>
        <ion-label>Alerts</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="profile" href="/profile" (click)="onTabClick('profile')">
        <ion-icon aria-hidden="true" name="person"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-content>
