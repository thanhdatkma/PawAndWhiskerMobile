<app-header
  [showBackButton]="true"
  [showCart]="false"
  [showShare]="!!article"
  [title]="article?.title || 'Article'"
  backButtonDefaultHref="/home"
  (shareClick)="onShare()">
</app-header>

<ion-content>

  <!-- Loading -->
  <div class="news-detail__loader" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- Error -->
  <div class="news-detail__error" *ngIf="error && !loading">
    <p>{{ error }}</p>
  </div>

  <!-- Article -->
  <div class="news-detail" *ngIf="article && !loading">

    <!-- Hero Image -->
    <div class="news-detail__hero">
      <ion-img [src]="article.image_url || article.thumbnailImage || 'assets/images/no-image.png'" [alt]="article.title" class="news-detail__hero-img"></ion-img>
      <div class="news-detail__hero-overlay">
        <span class="news-detail__category">KIẾN THỨC</span>
        <h1 class="news-detail__title">{{ article.title }}</h1>
      </div>
    </div>

    <!-- Meta -->
    <div class="news-detail__meta">
      <span class="news-detail__author">{{ article.author }}</span>
      <span class="news-detail__sep">·</span>
      <span class="news-detail__date">{{ article.created_at | date:'longDate' }}</span>
    </div>

    <!-- Summary / Intro -->
    <p class="news-detail__summary" *ngIf="article.summary">{{ article.summary }}</p>

    <!-- Full Content -->
    <div class="news-detail__content" *ngIf="article.content" [innerHTML]="safeContent"></div>

  </div>

</ion-content>
