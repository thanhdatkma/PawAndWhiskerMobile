<ion-content>
  <div class="success-container">
    <!-- Decorative Elements -->
    <div class="decorative-blob top-left"></div>
    <div class="decorative-blob bottom-right"></div>

    <div class="content-wrapper">
      <!-- Celebration Illustration -->
      <div class="illustration-box">
        <div class="glow"></div>
        <div class="image-container">
          <ion-img src="assets/images/verify-successed.png" alt="Success"></ion-img>
        </div>
        <!-- Success Badge -->
        <div class="success-badge">
          <ion-icon name="checkmark-outline"></ion-icon>
        </div>
      </div>

      <!-- Typography -->
      <div class="text-section">
        <h1>OTP Verified!</h1>
        <p>
          Your identity has been confirmed. You can now set a
          <span class="brand-name">new password</span> for your account.
        </p>
        <p class="auto-redirect">
          Redirecting in <strong>{{ countdown }}s</strong>...
        </p>
      </div>

      <!-- Actions -->
      <div class="action-buttons">
        <ion-button expand="block" mode="ios" class="primary-btn" (click)="goToReset()">
          Set New Password
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>
      </div>
    </div>

    <!-- Progress Indicator -->
    <!-- <div class="progress-indicator">
      <div class="fill"></div>
    </div> -->
  </div>
</ion-content>
