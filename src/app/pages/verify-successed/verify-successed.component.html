<ion-content>
  <div class="success-container">
    <!-- Decorative Elements -->
    <div class="decorative-blob top-left"></div>
    <div class="decorative-blob bottom-right"></div>

    <div class="content-wrapper">
      <!-- Celebration Illustration -->
      <div class="illustration-box">
        <div class="glow"></div>
        <div class="image-container">
          <img src="assets/images/verify-successed.png" alt="Success">
        </div>
        <!-- Success Badge -->
        <div class="success-badge">
          <ion-icon name="checkmark-outline"></ion-icon>
        </div>
      </div>

      <!-- Typography -->
      <div class="text-section">
        <h1>Verification Successful!</h1>
        <p>
          Your account has been verified. Welcome to the
          <span class="brand-name">Paws & Whiskers</span> family!
        </p>
        <p class="auto-redirect">
          Redirecting to home in <strong>{{ countdown }}s</strong>...
        </p>
      </div>

      <!-- Actions -->
      <div class="action-buttons">
        <ion-button expand="block" mode="ios" class="primary-btn" (click)="goToHome()">
          Continue to Home
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>

        <!-- <ion-button fill="clear" mode="ios" class="secondary-btn" (click)="setupProfile()">
          Set up pet profile later
        </ion-button> -->
      </div>
    </div>

    <!-- Progress Indicator -->
    <!-- <div class="progress-indicator">
      <div class="fill"></div>
    </div> -->
  </div>
</ion-content>
