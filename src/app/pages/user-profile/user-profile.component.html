<ion-grid class="profile-grid" *ngIf="currentUser() as user">
  <ion-row>
    <ion-col class="ion-padding">

      <!-- User Info Section -->
      <ion-grid class="user-hero ion-no-padding">
        <ion-row class="ion-justify-content-center">
          <ion-col size="auto" class="ion-text-center">
            <div class="avatar-wrapper">
              <div class="avatar-container">
                <div class="avatar-inner">
                  <ion-img [src]="user.avatar | mediaUrl" class="user-avatar" alt="User avatar"></ion-img>
                </div>
                <!-- Premium Badge top-left -->
                <div class="premium-badge" *ngIf="user.membership === 'Premium Member'">
                  <ion-icon name="diamond" class="premium-icon"></ion-icon>
                </div>
                <!-- <ion-button fill="solid" class="camera-btn" aria-label="Edit profile">
                  <ion-icon name="camera-outline"></ion-icon>
                </ion-button> -->
              </div>
            </div>

            <ion-text class="user-name">
              <h2>{{ user.name }}</h2>
            </ion-text>

            <div class="user-actions">
              <ion-button fill="outline" shape="round" class="edit-profile-btn" mode="ios" (click)="onEditProfile()">
                Edit Profile
              </ion-button>
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>

      <!-- Pet Status Card -->
      <ion-card class="pet-card" *ngIf="user.pet as pet">
        <div class="pet-card-layout">
          <div class="pet-image-wrapper">
            <div class="image-inner">
              <ion-img [src]="pet.image" class="pet-image" [alt]="pet.name"></ion-img>
            </div>
          </div>

          <div class="pet-info-header">
            <h3 class="pet-name text-center">{{ pet.name }}</h3>
            <p class="pet-breed text-center">{{ pet.breed }}</p>
          </div>

          <ion-list class="pet-info-list" lines="none">
            <ion-item class="pet-info-item">
              <div slot="start" class="info-icon-wrapper">
                <ion-icon name="fitness-outline"></ion-icon>
              </div>
              <ion-label>
                <p class="info-label">Weight</p>
                <h4 class="info-value">{{ pet.weight }}</h4>
              </ion-label>
            </ion-item>

            <ion-item class="pet-info-item">
              <div slot="start" class="info-icon-wrapper">
                <ion-icon name="calendar-outline"></ion-icon>
              </div>
              <ion-label>
                <p class="info-label">Age</p>
                <h4 class="info-value">{{ pet.age }}</h4>
              </ion-label>
            </ion-item>

            <ion-item class="pet-info-item vaccine-highlight">
              <div slot="start" class="info-icon-wrapper vaccine-icon">
                <ion-icon name="medical-outline"></ion-icon>
              </div>
              <ion-label>
                <p class="info-label">Next Vaccine</p>
                <h4 class="info-value">{{ pet.nextVaccine }}</h4>
              </ion-label>
            </ion-item>
          </ion-list>
        </div>
      </ion-card>

      <!-- Action Menu -->
      <ion-list class="profile-menu ion-no-padding" lines="none">
        <ion-item button detail="true" class="profile-menu-item" detail-icon="chevron-forward-outline">
          <div slot="start" class="item-icon-wrapper">
            <ion-icon name="bag-outline"></ion-icon>
          </div>
          <ion-label>My Orders</ion-label>
        </ion-item>

        <ion-item button detail="true" class="profile-menu-item" detail-icon="chevron-forward-outline">
          <div slot="start" class="item-icon-wrapper">
            <ion-icon name="heart-outline"></ion-icon>
          </div>
          <ion-label>Health Records</ion-label>
        </ion-item>

        <ion-item button detail="true" class="profile-menu-item" detail-icon="chevron-forward-outline">
          <div slot="start" class="item-icon-wrapper">
            <ion-icon name="card-outline"></ion-icon>
          </div>
          <ion-label>Payment Methods</ion-label>
        </ion-item>

        <ion-item button detail="true" class="profile-menu-item" detail-icon="chevron-forward-outline">
          <div slot="start" class="item-icon-wrapper">
            <ion-icon name="location-outline"></ion-icon>
          </div>
          <ion-label>Shipping Addresses</ion-label>
        </ion-item>
      </ion-list>

      <!-- Logout Action -->
      <ion-button expand="block" fill="clear" class="logout-action-btn" (click)="onLogout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        Sign Out
      </ion-button>

    </ion-col>
  </ion-row>
</ion-grid>
