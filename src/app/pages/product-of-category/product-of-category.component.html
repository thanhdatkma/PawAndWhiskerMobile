<app-header 
  [title]="categoryName" 
  [showBackButton]="true" 
  backButtonDefaultHref="/tabs/categories"
  [showSearch]="showSearch"
  searchPlaceholder="Search in this category"
  (searchChange)="onSearchChange($event)">
</app-header>

<ion-content [fullscreen]="true" [scrollEvents]="true" (ionScroll)="onScroll($event)">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="sticky-filter-wrapper" [class.filter-hidden]="isFilterHidden">
    <div class="filter-bar">
      <div class="filter-scroll-container">
        <button class="filter-btn" (click)="openFilterSort(FilterTab.BRANDS)" [class.has-filter]="getFilterCount(FilterTab.BRANDS) > 0">
          <ion-text>Brands</ion-text>
          <ion-badge color="primary" *ngIf="getFilterCount(FilterTab.BRANDS) > 0" class="filter-badge">{{getFilterCount(FilterTab.BRANDS)}}</ion-badge>
          <ion-icon name="chevron-down-outline" *ngIf="getFilterCount(FilterTab.BRANDS) === 0"></ion-icon>
        </button>
        <button class="filter-btn" (click)="openFilterSort(FilterTab.PRICING)" [class.has-filter]="getFilterCount(FilterTab.PRICING) > 0">
          <ion-text>Pricing</ion-text>
          <ion-badge color="primary" *ngIf="getFilterCount(FilterTab.PRICING) > 0" class="filter-badge">{{getFilterCount(FilterTab.PRICING)}}</ion-badge>
          <ion-icon name="chevron-down-outline" *ngIf="getFilterCount(FilterTab.PRICING) === 0"></ion-icon>
        </button>
        <button class="filter-btn" (click)="openFilterSort(FilterTab.TAGS)" [class.has-filter]="getFilterCount(FilterTab.TAGS) > 0">
          <ion-text>Tags</ion-text>
          <ion-badge color="primary" *ngIf="getFilterCount(FilterTab.TAGS) > 0" class="filter-badge">{{getFilterCount(FilterTab.TAGS)}}</ion-badge>
          <ion-icon name="chevron-down-outline" *ngIf="getFilterCount(FilterTab.TAGS) === 0"></ion-icon>
        </button>
        <button class="filter-btn" (click)="openFilterSort(FilterTab.SORT)" [class.has-filter]="filterState.selectedSort?.value !== SortType.DEFAULT">
          <ion-icon name="swap-vertical-outline"></ion-icon>
          <ion-text>{{ filterState.selectedSort | sortLabel }}</ion-text>
        </button>
      </div>
      <!-- <div class="items-found-container">
        <ion-text class="items-found">{{ products.length }} items found</ion-text>
      </div> -->
    </div>
  </div>

  <div class="main-container product-list-container">
    <!-- Product Grid -->
    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="6" *ngFor="let product of products" class="ion-padding-small">
          <app-product-card 
            [product]="product" 
            (cardClick)="viewProduct($event.id)">
          </app-product-card>
        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-infinite-scroll threshold="100px" (ionInfinite)="loadData($event)" [disabled]="!(hasMore$ | async)">
      <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more products...">
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div>
</ion-content>
