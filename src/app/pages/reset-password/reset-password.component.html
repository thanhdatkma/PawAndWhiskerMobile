<ion-header class="ion-no-border">
  <ion-toolbar>
    <app-header title="Reset Password" [showBack]="true" (backClick)="goBack()"></app-header>
  </ion-toolbar>
</ion-header>

<ion-content class="reset-content">
  <div class="page-wrapper">

    <div class="icon-section">
      <div class="icon-ring">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>
      <h1>Set New Password</h1>
      <p>Your new password must be at least 6 characters long.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">

      <!-- New Password -->
      <div class="field-group">
        <ion-label>New Password</ion-label>
        <ion-item lines="none" class="input-item">
          <ion-icon name="lock-closed-outline" slot="start" class="field-icon"></ion-icon>
          <ion-input
            formControlName="new_password"
            [type]="showNewPassword ? 'text' : 'password'"
            placeholder="Enter new password"
            autocomplete="new-password">
          </ion-input>
          <ion-icon
            [name]="showNewPassword ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            class="toggle-icon"
            (click)="showNewPassword = !showNewPassword">
          </ion-icon>
        </ion-item>
        <ion-text color="danger" class="field-error"
          *ngIf="resetForm.get('new_password')?.touched && resetForm.get('new_password')?.hasError('required')">
          Password is required.
        </ion-text>
        <ion-text color="danger" class="field-error"
          *ngIf="resetForm.get('new_password')?.touched && resetForm.get('new_password')?.hasError('minlength')">
          Password must be at least 6 characters.
        </ion-text>
      </div>

      <!-- Confirm Password -->
      <div class="field-group">
        <ion-label>Confirm Password</ion-label>
        <ion-item lines="none" class="input-item">
          <ion-icon name="lock-closed-outline" slot="start" class="field-icon"></ion-icon>
          <ion-input
            formControlName="confirm_password"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Confirm new password"
            autocomplete="new-password">
          </ion-input>
          <ion-icon
            [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            class="toggle-icon"
            (click)="showConfirmPassword = !showConfirmPassword">
          </ion-icon>
        </ion-item>
        <ion-text color="danger" class="field-error"
          *ngIf="resetForm.get('confirm_password')?.touched && resetForm.hasError('passwordMismatch')">
          Passwords do not match.
        </ion-text>
      </div>

      <!-- Submit -->
      <ion-button
        expand="block"
        mode="ios"
        type="submit"
        class="submit-btn"
        [disabled]="isLoading">
        <ion-spinner *ngIf="isLoading" name="crescent" slot="start"></ion-spinner>
        {{ isLoading ? 'Updating...' : 'Reset Password' }}
      </ion-button>

    </form>
  </div>
</ion-content>
