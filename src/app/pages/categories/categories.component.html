<ion-content>
  <div class="categories-wrapper">
    <!-- Left Sidebar: Parent Categories -->
    <aside class="sidebar hide-scrollbar">
      <div *ngFor="let cat of categories; trackBy: trackByFn" class="parent-item"
        [class.parent-item--active]="cat.id === selectedParent.id" (click)="selectParent(cat)">
        <div class="parent-item__icon-box">
          <span class="material-symbols-outlined parent-item__icon">{{ cat.iconName }}</span>
        </div>
        <ion-text class="parent-item__label">{{ cat.name }}</ion-text>
      </div>
    </aside>

    <!-- Right Content: Child Categories -->
    <ion-content [scrollEvents]="true" [fullscreen]="true" (ionScroll)="handleScroll($event)">
      <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
        <ion-refresher-content></ion-refresher-content>
      </ion-refresher>
      <section class="main-content hide-scrollbar">
        <div class="section-header">

          <ion-text color="dark">
            <h2 class="section-header__title">{{ selectedParent.name }} Essentials</h2>
          </ion-text>
          <ion-text color="primary" class="section-header__count">
            {{ selectedParent.children?.length ?? 0 }} Items
          </ion-text>
        </div>

        <ion-grid class="ion-no-padding">
          <ion-row>
            <ion-col size="6" *ngFor="let child of selectedParent.children; trackBy: trackByFn"
              class="ion-padding-tiny">
              <div class="child-card group" (click)="navigate('/category-detail/' + child.id)">
                <div class="child-card__image-container">
                  <ion-img class="child-card__image" [src]="child.image" [alt]="child.name"></ion-img>
                </div>
                <div class="child-card__footer">
                  <ion-text class="child-card__name">{{ child.name }}</ion-text>
                  <div class="child-card__action">
                    <span>xem thêm</span>
                    <span class="material-symbols-outlined">chevron_right</span>
                  </div>
                </div>
              </div>
            </ion-col>
          </ion-row>

          <ion-row *ngIf="!selectedParent.children?.length">
            <ion-col size="12" class="ion-text-center ion-padding">
              <ion-text color="medium">No sub-categories found.</ion-text>
            </ion-col>
          </ion-row>
        </ion-grid>
      </section>
    </ion-content>

  </div>
</ion-content>
