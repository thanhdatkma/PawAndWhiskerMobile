<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event, 'profile')">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="profile-container">
    <ion-list lines="none" class="settings-list">
      <ion-item class="settings-item">
        <ion-label>
          <h2 class="text-headline">Dark Mode</h2>
          <p class="text-body">Enable dark theme across the app</p>
        </ion-label>
        <ion-toggle slot="end" [checked]="(configService.settings$ | async)?.isDarkmode"
          (ionChange)="onDarkModeToggle()">
        </ion-toggle>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
