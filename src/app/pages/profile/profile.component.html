<ion-content class="welcome-content" [scrollY]="false">
  <div class="welcome-container">
    <!-- Full-Screen Background Image -->
    <div class="background-image">
      <img src="./assets/images/login-bg.png" alt="Cute puppy and kitten">
    </div>

    <!-- Gradient Overlay -->
    <div class="gradient-overlay"></div>

    <!-- Content -->
    <div class="content-wrapper">
      <!-- Top Section: Logo -->
      <div class="top-section">
        <span class="material-symbols-outlined logo-icon">pets</span>
        <h1 class="app-title">Paws &<br>Whiskers</h1>
      </div>

      <!-- Bottom Section: Actions -->
      <div class="bottom-section">
        <button class="btn-primary">
          Login
        </button>
        <button class="btn-secondary">
          Register
        </button>
        <p class="terms-text">
          By continuing, you agree to our
          <a href="#">Terms of Service</a>
        </p>
      </div>
    </div>
  </div>
</ion-content>
